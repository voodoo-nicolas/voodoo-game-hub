<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432">
<rect width="432" height="432" rx="72" fill="#16382e"/>

<!-- 3x3 sudoku grid -->
<g stroke="#e8dcc8" stroke-width="6" fill="none">
<rect x="96" y="96" width="240" height="240"/>
<line x1="176" y1="96" x2="176" y2="336"/>
<line x1="256" y1="96" x2="256" y2="336"/>
<line x1="96" y1="176" x2="336" y2="176"/>
<line x1="96" y1="256" x2="336" y2="256"/>
</g>
<g stroke="#e8dcc8" stroke-width="1.5" opacity="0.5">
<line x1="136" y1="96" x2="136" y2="336"/>
<line x1="216" y1="96" x2="216" y2="336"/>
<line x1="296" y1="96" x2="296" y2="336"/>
<line x1="96" y1="136" x2="336" y2="136"/>
<line x1="96" y1="216" x2="336" y2="216"/>
<line x1="96" y1="296" x2="336" y2="296"/>
</g>
<text x="136" y="164" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffd60a" text-anchor="middle">5</text>
<text x="296" y="244" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffd60a" text-anchor="middle">9</text>
<text x="216" y="324" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffd60a" text-anchor="middle">3</text>

<!-- voodoo badge: bottom-left, like a shortcut overlay -->
<circle cx="100" cy="332" r="58" fill="#1a0f1a" stroke="#e8dcc8" stroke-width="5"/>
<circle cx="100" cy="332" r="34" fill="#e8dcc8"/>
<g stroke="#1a0f1a" stroke-width="4.5" stroke-linecap="round">
<line x1="86" y1="322" x2="96" y2="332"/>
<line x1="96" y1="322" x2="86" y2="332"/>
<line x1="104" y1="322" x2="114" y2="332"/>
<line x1="114" y1="322" x2="104" y2="332"/>
</g>
<line x1="90" y1="346" x2="110" y2="346" stroke="#1a0f1a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
