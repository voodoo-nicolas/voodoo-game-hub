<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432">
<rect width="432" height="432" rx="72" fill="#182338"/>

<!-- two overlapping playing cards -->
<g transform="rotate(-10 216 216)">
<rect x="146" y="106" width="120" height="168" rx="14" fill="#e8dcc8" stroke="#1a0f1a" stroke-width="4"/>
<text x="164" y="150" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#c94f4f" text-anchor="middle">A</text>
<text x="164" y="182" font-family="Arial, sans-serif" font-size="34" fill="#c94f4f" text-anchor="middle">♥</text>
</g>
<g transform="rotate(10 216 216)">
<rect x="166" y="126" width="120" height="168" rx="14" fill="#e8dcc8" stroke="#1a0f1a" stroke-width="4"/>
<text x="184" y="170" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#1a0f1a" text-anchor="middle">K</text>
<text x="184" y="202" font-family="Arial, sans-serif" font-size="34" fill="#1a0f1a" text-anchor="middle">♠</text>
</g>

<!-- voodoo badge: bottom-left, like a shortcut overlay -->
<circle cx="100" cy="332" r="58" fill="#1a0f1a" stroke="#e8dcc8" stroke-width="5"/>
<circle cx="100" cy="332" r="34" fill="#e8dcc8"/>
<g stroke="#1a0f1a" stroke-width="4.5" stroke-linecap="round">
<line x1="86" y1="322" x2="96" y2="332"/>
<line x1="96" y1="322" x2="86" y2="332"/>
<line x1="104" y1="322" x2="114" y2="332"/>
<line x1="114" y1="322" x2="104" y2="332"/>
</g>
<line x1="90" y1="346" x2="110" y2="346" stroke="#1a0f1a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
