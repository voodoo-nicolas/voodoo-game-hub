<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Voodoo IQ</title>
<meta name="description" content="Nine intelligences, adaptive IQ-style tests, Blitz mini games and leaderboards.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: single centered column on phones, two columns (brain | play) on wide screens.
   Deliberately one dark, high-contrast look: text ≥ 7:1, shapes ≥ 3:1, color never the only cue. */
:root {
  color-scheme: dark;
  --bg: #07070C; --panel: #11111B; --panel2: #1A1A28; --line: #3B3B57; --line2: #6A6A90;
  --fg: #FFFFFF; --fg2: #D2D2E2; --fg3: #A9A9C4;
  --accent: #FFE14D; --ok: #3DFF9A; --bad: #FF6B6B; --warn: #FFB547;
  --disp: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, Arial, sans-serif;
  --scale: 1; --r: 14px;
}
html { font-size: calc(18px * var(--scale)); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5; margin: 0; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--disp); font-weight: 800; letter-spacing: .01em; line-height: 1.05; text-wrap: balance; margin: 0 0 .5rem; }
h1 { font-size: 2.4rem; } h2 { font-size: 1.55rem; } h3 { font-size: 1.25rem; }
p { margin: 0 0 .6rem; }
.muted { color: var(--fg2); } .fine { color: var(--fg3); font-size: .82rem; margin-top: .6rem; } .note { color: var(--fg2); font-size: .9rem; }
.good { color: var(--ok); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; } .center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }

/* header */
#hdr { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 14px; border-bottom: 2px solid var(--line); margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.logo { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--disp); font-weight: 900; font-size: 1.9rem; line-height: 1; display: flex; gap: 6px; }
.logo .l1 { color: var(--fg); } .logo .l2 { color: var(--bg); background: var(--accent); padding: 0 6px; border-radius: 4px; }
.tag { color: var(--fg2); font-size: .85rem; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.navb { background: transparent; border: 2px solid transparent; border-radius: 999px; padding: .4rem .9rem; font-weight: 700; cursor: pointer; color: var(--fg2); }
.navb:hover { color: var(--fg); border-color: var(--line); }
.navb.on { color: var(--bg); background: var(--fg); }
.prefs { display: flex; gap: 8px; }
body.testing #hdr .nav, body.testing #hdr .tag { display: none; }

/* generic */
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.col { display: flex; flex-direction: column; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 48px; padding: .55rem 1.1rem; border-radius: 12px; border: 2px solid var(--fg2); background: var(--panel2); color: var(--fg); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--fg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #07070C; border-color: var(--accent); }
.btn.primary:hover { background: #FFF07A; }
.btn.ghost { background: transparent; border-color: var(--line2); }
.btn.danger { background: var(--bad); color: #07070C; border-color: var(--bad); }
.btn.small { min-height: 40px; padding: .3rem .8rem; font-size: .9rem; }
.btn.big { min-height: 60px; font-size: 1.15rem; padding-inline: 1.6rem; }
.btn.huge { width: 100%; min-height: 66px; font-size: 1.3rem; font-family: var(--disp); font-weight: 900; letter-spacing: .03em; margin-top: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .segb { flex: 1 1 auto; min-height: 48px; padding: .45rem .8rem; border-radius: 10px; border: 2px solid var(--line2); background: var(--panel2); cursor: pointer; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.seg .on, .segb.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.segb small { font-weight: 400; font-size: .78rem; opacity: .9; }
.seg.tiny button { min-height: 38px; padding: .2rem .6rem; flex: 0 0 auto; font-size: .85rem; }
.badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 700; border: 2px solid currentColor; margin-left: .4rem; vertical-align: middle; }
.badge.ranked { color: var(--accent); } .badge.practice { color: var(--fg2); } .badge.warn { color: var(--warn); } .badge.genius { color: #07070C; background: var(--accent); border-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { color: var(--fg2); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }
td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td.big { font-family: var(--disp); font-size: 1.5rem; font-weight: 900; }
.sicon { flex: none; vertical-align: middle; }

/* home */
.hero { margin-bottom: 14px; }
.hero h1 { font-size: clamp(2rem, 6vw, 3.4rem); max-width: 20ch; }
.lede { color: var(--fg2); max-width: 62ch; font-size: 1.02rem; }
.brain { width: 100%; height: auto; display: block; max-width: 640px; margin: 0 auto; }
.brain .region { transition: fill-opacity .2s; }
.brain [data-sec] { cursor: pointer; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 6px; margin-top: 10px; }
.lchip { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: .35rem .6rem; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); cursor: pointer; text-align: left; font-weight: 700; font-size: .92rem; }
.lchip .num { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--c, var(--fg)); font-size: .8rem; }
.lchip:hover { border-color: var(--c, var(--fg)); }
.lchip.on { border-color: var(--c, var(--fg)); background: color-mix(in srgb, var(--c, #fff) 22%, var(--panel2)); box-shadow: inset 0 0 0 1px var(--c, #fff); }
.lchip:disabled { opacity: .4; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chips .lchip { min-height: 42px; }
.selinfo { margin-top: 14px; padding: 14px; border-radius: 12px; border: 2px solid var(--c, var(--line)); background: var(--bg); }
.selinfo h3 { display: flex; align-items: center; gap: 8px; }
.selinfo .area { color: var(--fg2); font-size: .92rem; }
.play .field { margin-bottom: 14px; }
.flab { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--fg2); margin-bottom: 6px; font-weight: 700; }
.scopeval { font-weight: 700; font-size: 1.1rem; padding: .4rem .7rem; border-left: 6px solid var(--c, var(--fg)); background: var(--panel2); border-radius: 6px; }
.hint { color: var(--fg3); font-size: .85rem; margin-top: 4px; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .sw { flex: none; width: 56px; height: 32px; border-radius: 999px; background: var(--panel2); border: 2px solid var(--line2); position: relative; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg2); transition: transform .15s; }
.switch input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .sw::after { transform: translateX(24px); background: #07070C; }
.switch input:focus-visible + .sw { outline: 3px solid var(--accent); outline-offset: 3px; }
.switch input:disabled + .sw { opacity: .4; }
.switch small { display: block; color: var(--fg2); font-size: .85rem; }
.daily .dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.daily .date { color: var(--fg2); font-variant-numeric: tabular-nums; }
.daily .done { color: var(--ok); font-weight: 700; }
.mini { list-style: none; padding: 0; margin: 12px 0 0; counter-reset: m; }
.mini li { display: flex; justify-content: space-between; gap: 10px; padding: .35rem 0; border-bottom: 1px solid var(--line); counter-increment: m; }
.mini li::before { content: counter(m); width: 1.6rem; color: var(--fg2); font-weight: 700; }
.mini li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini li.me { color: var(--accent); }
.how summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 40px; display: flex; align-items: center; }
.how ul { margin: .6rem 0 0; padding-left: 1.2rem; } .how li { margin-bottom: .5rem; max-width: 70ch; }

/* test */
.test { max-width: 760px; margin: 0 auto; }
.tbar { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 5; }
.tleft { min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: .25rem .7rem .25rem .45rem; border-radius: 999px; border: 2px solid var(--c); color: var(--fg); max-width: 100%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tmeta { font-size: .8rem; color: var(--fg2); margin-top: 3px; }
.clock { font-family: var(--disp); font-weight: 900; font-size: 2.3rem; font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: right; }
.clock.low { color: var(--bad); }
.itbar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
.itfill { height: 100%; background: var(--fg); transform-origin: left; transition: transform .1s linear; }
.itfill.low { background: var(--bad); }
.brow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.bstat { display: flex; gap: 14px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.bstat .bc { color: var(--ok); } .bstat .bw { color: var(--bad); }
.qarea { min-height: 50vh; border-radius: var(--r); transition: box-shadow .15s; }
.qarea.sent { opacity: .5; }
.qarea.fx-ok { box-shadow: 0 0 0 4px var(--ok); } .qarea.fx-bad { box-shadow: 0 0 0 4px var(--bad); }
.qprompt { font-size: 1.25rem; font-weight: 700; margin-bottom: 14px; text-wrap: balance; }
.qsub { font-size: .95rem; font-weight: 400; color: var(--fg2); margin-top: 4px; }
.mc { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
@media (max-width: 520px) { .mc.mxopts { grid-template-columns: repeat(4, minmax(0, 1fr)); } .mc.tvopts { grid-template-columns: repeat(3, minmax(0, 1fr)); } .mc.creatures { grid-template-columns: repeat(3, minmax(0, 1fr)); } .mc.faces { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { position: relative; min-height: 60px; padding: 10px; border-radius: 12px; border: 3px solid var(--line2); background: var(--panel2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 1.05rem; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt:disabled { opacity: .45; cursor: not-allowed; }
.opt.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--panel2)); }
.opt.right { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok); }
.optk { position: absolute; top: 4px; left: 7px; font-size: .72rem; color: var(--fg3); font-weight: 700; }
.opt svg { max-width: 100%; height: auto; }
.words .opt { justify-content: flex-start; padding-left: 2rem; text-align: left; }
.word.left { text-align: left; }
.series { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.snum { font-family: var(--disp); font-weight: 900; font-size: 2rem; min-width: 3.2ch; padding: .2rem .55rem; border: 2px solid var(--line2); border-radius: 10px; text-align: center; font-variant-numeric: tabular-nums; }
.snum.q { border-color: var(--accent); color: var(--accent); }
.numdisp { font-family: var(--disp); font-weight: 900; font-size: 2.4rem; text-align: center; min-height: 3.4rem; border: 2px solid var(--line2); border-radius: 12px; margin: 6px auto 10px; max-width: 360px; display: flex; justify-content: center; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.numdisp .slot { width: 1.3ch; border-bottom: 3px solid var(--fg3); min-height: 2.6rem; }
.numdisp .slot.on { border-color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; margin: 0 auto; }
.key { min-height: 58px; border-radius: 12px; border: 2px solid var(--line2); background: var(--panel2); font-size: 1.5rem; font-weight: 700; cursor: pointer; }
.key:active { background: var(--fg); color: var(--bg); }
.key.ok { background: var(--accent); color: #07070C; border-color: var(--accent); }
.key.wide { grid-column: 1 / -1; min-height: 46px; font-size: 1.1rem; }
.bigdigit { font-family: var(--disp); font-weight: 900; font-size: 7rem; text-align: center; min-height: 9rem; line-height: 9rem; }
.warnbanner { background: var(--warn); color: #07070C; font-weight: 700; text-align: center; border-radius: 10px; padding: .4rem; margin-bottom: 8px; font-size: 1.2rem; }
.arith { font-family: var(--disp); font-weight: 900; font-size: 3.6rem; text-align: center; margin: 10px 0; font-variant-numeric: tabular-nums; }
.mxgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 340px; margin: 0 auto 6px; }
.mxc { aspect-ratio: 1; border: 2px solid var(--line2); border-radius: 8px; background: var(--panel2); display: grid; place-items: center; max-width: 100%; }
.mxc svg { width: 100%; height: 100%; }
.mxc.q { border: 3px dashed var(--accent); }
.qmark { font-family: var(--disp); font-weight: 900; font-size: 2.6rem; color: var(--accent); }
.tvwrap { display: flex; justify-content: center; background: var(--panel2); border-radius: 12px; padding: 8px; }
.tviso { width: 100%; max-width: 420px; height: auto; max-height: 42vh; }
.tvopts .opt { padding: 6px; }
.rottarget, .rowpair { display: flex; justify-content: center; gap: 30px; padding: 10px; background: var(--panel2); border-radius: 12px; }
.corsi { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; margin: 10px auto; background: var(--panel2); border-radius: 14px; border: 2px solid var(--line); }
.cblock { position: absolute; width: 16%; aspect-ratio: 1; border-radius: 10px; background: #4A4A6E; border: 3px solid #8888B0; cursor: pointer; }
.cblock.lit { background: var(--accent); border-color: #FFFFFF; box-shadow: 0 0 22px var(--accent); }
.cblock.tap { background: var(--fg); }
.cblock:disabled { cursor: default; }
.anaout { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.anaout .slot { width: 2.4rem; height: 3rem; border-bottom: 4px solid var(--fg3); display: grid; place-items: center; font-family: var(--disp); font-weight: 900; font-size: 2rem; }
.anaout .slot.on { border-color: var(--accent); }
.anatiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
.tile { width: 3.2rem; height: 3.4rem; border-radius: 10px; border: 3px solid var(--fg2); background: var(--panel2); font-family: var(--disp); font-weight: 900; font-size: 1.8rem; cursor: pointer; }
.tile:disabled { opacity: .25; }
.analogy { font-size: 1.5rem; text-align: center; padding: 14px; background: var(--panel2); border-radius: 12px; overflow-wrap: anywhere; }
.analogy .asep { color: var(--accent); font-weight: 900; }
.audioq { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px; background: var(--panel2); border-radius: 12px; }
.audioq.playing .play { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 40%, transparent); }
.fams { display: grid; gap: 8px; }
.fam { display: grid; grid-template-columns: 6.2rem 1fr; align-items: center; gap: 8px; background: var(--panel2); border-radius: 10px; padding: 6px 8px; }
.famlab { font-weight: 700; }
.famrow { display: flex; flex-wrap: wrap; gap: 4px; }
.natq { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; padding: 8px; border: 3px dashed var(--accent); border-radius: 12px; }
.creature { display: block; background: #E9E9F2; border-radius: 10px; }
.arena { position: relative; height: min(56vh, 420px); background: var(--panel2); border-radius: 14px; border: 2px solid var(--line); touch-action: none; user-select: none; overflow: hidden; }
.arena.good { border-color: var(--ok); } .arena.bad { border-color: var(--bad); }
.target { position: absolute; border-radius: 50%; background: var(--accent); border: 4px solid #FFFFFF; box-shadow: 0 0 0 4px #07070C inset; cursor: pointer; }
.track .tline { position: absolute; top: 15%; bottom: 15%; width: 6px; background: var(--fg); border-radius: 3px; }
.track .tdot { position: absolute; top: calc(50% - 16px); left: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; margin-left: -16px; }
.tmsg { position: absolute; bottom: 10px; width: 100%; text-align: center; font-weight: 700; font-size: 1.2rem; }
.facewrap { display: flex; justify-content: center; background: #2C2C40; border-radius: 12px; padding: 10px; }
.face { display: block; height: auto; max-width: 100%; }
.faces .opt { background: #2C2C40; }
.premises { background: var(--panel2); border-radius: 12px; padding: 12px 16px; font-size: 1.15rem; font-weight: 700; border-left: 6px solid var(--c, var(--fg)); }
.premises div + div { margin-top: 6px; }
.argument { margin: 0; background: var(--panel2); border-left: 6px solid var(--fg2); padding: 12px 16px; border-radius: 8px; font-size: 1.1rem; }
.sec-EXI .premises { --c: #FF4D5E; }

/* overlay */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .82); z-index: 50; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) 16px 24px; }
.ovpanel { background: var(--panel); border: 2px solid var(--fg2); border-radius: 18px; width: 100%; max-width: 640px; margin-top: 4vh; }
.ovbody { padding: 20px; }
.ovsec { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: .2rem .7rem .2rem .4rem; border: 2px solid var(--c); border-radius: 999px; margin-bottom: 10px; }
.ovbody .ins { font-size: 1.08rem; }
.ovbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.exarea { margin-top: 10px; }
.example { border: 2px dashed var(--line2); border-radius: 12px; padding: 12px; }
.exlab { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--fg2); margin-bottom: 6px; }
.exres { font-weight: 700; margin-top: 8px; font-size: 1.1rem; } .exres.ok { color: var(--ok); } .exres.bad { color: var(--bad); }
.hpcheck { background: var(--panel2); border-radius: 12px; padding: 12px; margin: 10px 0; }
.bignum { display: block; font-family: var(--disp); font-weight: 900; font-size: 3rem; text-align: center; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 40px; }
.form .ff { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.ff label, .lab { font-weight: 700; }
.ff small { color: var(--fg2); }
.ff input, .ff select { min-height: 48px; border-radius: 10px; border: 2px solid var(--line2); background: var(--bg); padding: 0 .7rem; }
.ff.inline { flex-direction: column; gap: 3px; min-width: 150px; flex: 1 1 150px; display: flex; }
.err { color: var(--bad); font-weight: 700; min-height: 1.2em; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 150%); background: var(--fg); color: var(--bg); font-weight: 700; padding: .7rem 1.1rem; border-radius: 12px; transition: transform .2s; z-index: 60; max-width: calc(100vw - 32px); }
#toast.on { transform: translate(-50%, 0); }

/* results */
.rtitle { font-size: 2.6rem; } .rsub { color: var(--fg2); }
.scard { border-top: 8px solid var(--c, var(--accent)); }
.schead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.schead h2 { display: flex; align-items: center; gap: 8px; }
.scoreline { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

const AU = {
  ctx: null,
  get() { if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },

  },
  now() { const c = this.get(); return c ? c.currentTime + 0.05 : 0; },
  blip(ok) { const c = this.get(); if (!c) return; const t0 = this.now(); this.tone(ok ? 880 : 220, t0, 0.09, 0.08, 'square'); }

/* Play button that unlocks the options once the clip has played. */
function audioQuestion(el, api, play, durS, opt = {}) {
  let plays = 0; const maxPlays = opt.replays != null ? opt.replays + 1 : 2;
  const area = h('div', { class: 'audioq' });
  const btn = h('button', { type: 'button', class: 'btn big play' }, '▶ ' + t('play'));
  const status = h('div', { class: 'qsub center', 'aria-live': 'polite' }, '');
  let ready = false;
  btn.addEventListener('click', async () => {
    if (plays >= maxPlays || btn.disabled) return;
    plays++; btn.disabled = true; status.textContent = t('listening'); area.classList.add('playing');
    play(AU.now());
    await sleep(durS * 1000 + 150);
    area.classList.remove('playing'); status.textContent = '';
    if (plays < maxPlays) { btn.disabled = false; btn.textContent = '↻ ' + t('replay_once'); } else btn.textContent = t('no_replays');
    if (!ready) { ready = true; opt.onReady(); api.ready(); }
  });
  area.append(btn, status); el.append(area);
  if (opt.autoplay) setTimeout(() => btn.click(), 250);
  return btn;
}

    g.fillStyle = '#CFCFE0'; g.font = '700 26px "Atkinson Hyperlegible", Arial, sans-serif'; g.fillText(t('cert_scan'), W / 2, 1260);
  } else { g.fillStyle = '#CFCFE0'; g.font = '700 28px "Atkinson Hyperlegible", Arial, sans-serif'; g.fillText(t('cert_verify_in_app'), W / 2, 1050); }
  g.font = '700 22px "Atkinson Hyperlegible", Arial, sans-serif'; g.fillStyle = '#9C9CB8'; g.fillText(t('cert_disclaimer'), W / 2, 1300);
  return cv;
}

/* ---------- starting runs ---------- */
function seed32() { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return Math.floor(Math.random() * 4294967295); } }
function startRun(cfg) {
  AU.get();
  if (cfg.ranked && !Store.canRank(cfg).ok) cfg.ranked = false;
  cfg.seed = cfg.seed || seed32();
  if (cfg.scope === 'SELF') { const me = Store.me(); const xs = me ? ['LOG', 'SPA'].map(s => secStanding(me, s)).filter(Boolean) : []; cfg.selfStart = xs.length ? sum(xs.map(x => x.theta)) / xs.length : 0; }
  const run = new Runner(cfg); S.run = run; S.view = 'test';
  run.begin();
}
function startDaily() {
  const cfg = { mode: 'blitz', scope: 'ALL', dur: 180, kind: 'daily', seed: hashStr('voodoo-daily-' + utcDay()) };
  cfg.ranked = Store.canRank(cfg).ok;
  startRun(cfg);
}

/* ---------- boot ---------- */
function boot() {
  document.documentElement.lang = S.lang; applyScale();
  UI.header();
  const hash = location.hash || '';
  if (/^#c-[A-Z0-9]{6,12}$/.test(hash)) { S.view = 'verify'; S.verifyTok = hash.slice(3); }
  UI.render(S.verifyTok);
  Store.onChange(() => { if (S.testing) return; clearTimeout(boot._t); boot._t = setTimeout(() => { if (['home', 'boards', 'me', 'verify'].includes(S.view)) UI.render(S.view === 'verify' ? S.verifyTok : undefined); }, 250); });
  setTimeout(() => Store.init(), 0);
}
boot();
</script>
