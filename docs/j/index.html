<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join a game — Viral Game Hub</title>
<!--
  Join link landing page (STANDARDS §5, app v0.31+). The app's online lobby
  shares https://voodoo-nicolas.github.io/voodoo-game-hub/j/?g=<game id>&c=<CODE>
  as a QR code and as text. There is no domain yet, so no Android App Link:
  this page shows the code and how to join, plus where to get the app.
  When a domain exists, /j/<CODE> moves there and the app claims it.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #05070d; color: #f2f4f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 380px; background: #0d1424; border-radius: 18px;
    padding: 28px 24px; border: 2px solid #3a8cff; box-shadow: 0 0 24px rgba(58,140,255,.35);
    text-align: center;
  }
  .brand { font-size: 13px; letter-spacing: .12em; color: #8b93a7; text-transform: uppercase; }
  h1 { font-size: 24px; margin: 10px 0 4px; color: #29e6ff; }
  .game { font-size: 18px; color: #f2f4f8; margin-bottom: 18px; min-height: 22px; }
  .code {
    font-size: 54px; font-weight: 800; letter-spacing: .18em; color: #ffd84a;
    text-shadow: 0 0 18px rgba(255,216,74,.45); margin: 6px 0 18px;
  }
  ol { text-align: left; color: #c9cfdc; font-size: 15px; line-height: 1.55; padding-left: 22px; margin: 0 0 20px; }
  a.btn {
    display: block; padding: 13px; border-radius: 12px; text-decoration: none;
    background: #7dff3a; color: #05070d; font-weight: 700; font-size: 15px;
  }
  .small { color: #8b93a7; font-size: 13px; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Viral Game Hub</div>
    <h1 id="title">You're invited to play!</h1>
    <div class="game" id="game"></div>
    <div class="code" id="code">····</div>
    <ol id="steps"></ol>
    <a class="btn" id="get" href="https://github.com/voodoo-nicolas/voodoo-game-hub/releases/latest">Get the app</a>
    <div class="small" id="note"></div>
  </div>
<script>
  const es = (navigator.language || "en").toLowerCase().startsWith("es");
  const T = es ? {
    title: "¡Te invitaron a jugar!",
    steps: (g) => [
      "Abre Viral Game Hub.",
      "Toca 🎮 Juegos y abre " + (g || "el juego") + ".",
      "Toca 👥 Multijugador → 🌐 En línea.",
      "Escribe el código de arriba y toca Unirse.",
    ],
    get: "Descargar la app (Android)",
    note: "Sin anuncios, nunca. Si el código expiró, pídele a tu amigo uno nuevo.",
    bad: "Este enlace no tiene código. Pídele a tu amigo que te lo comparta de nuevo.",
  } : {
    title: "You're invited to play!",
    steps: (g) => [
      "Open Viral Game Hub.",
      "Tap 🎮 Games and open " + (g || "the game") + ".",
      "Tap 👥 Multiplayer → 🌐 Online.",
      "Type the code above and tap Join.",
    ],
    get: "Get the app (Android)",
    note: "No ads, ever. If the code has expired, ask your friend for a new one.",
    bad: "This link has no code. Ask your friend to share it again.",
  };
  const q = new URLSearchParams(location.search);
  const code = (q.get("c") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 8);
  const id = (q.get("g") || "").replace(/[^a-z0-9_]/g, "");
  document.getElementById("title").textContent = T.title;
  document.getElementById("get").textContent = T.get;
  document.getElementById("note").textContent = code ? T.note : T.bad;
  document.getElementById("code").textContent = code || "····";
  function fill(name) {
    const ol = document.getElementById("steps");
    ol.innerHTML = "";
    for (const s of T.steps(name)) { const li = document.createElement("li"); li.textContent = s; ol.appendChild(li); }
    document.getElementById("game").textContent = name || "";
  }
  fill("");
  // The game's name from the live catalog (the app's own manifest.json).
  if (id) {
    fetch("https://raw.githubusercontent.com/voodoo-nicolas/voodoo-game-hub/master/manifest.json")
      .then(r => r.json())
      .then(m => {
        for (const c of m.categories || []) for (const g of c.games || []) {
          if (g.id === id) fill((es && g.title_es) ? g.title_es : g.title);
        }
      })
      .catch(() => {});
  }
</script>
</body>
</html>
