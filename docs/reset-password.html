<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your Voodoo password</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0d14; color: #f2f4f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 360px; background: #131826; border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #15ff8c; }
  p { color: #8b93a7; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #8b93a7; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a3142;
    background: #1b2233; color: #f2f4f8; font-size: 15px; margin-bottom: 16px;
  }
  input:focus { outline: 2px solid #15ff8c; }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: #15ff8c; color: #0a0d14; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
  .ok { color: #6ee7a0; }
  .err { color: #ff8f7d; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p id="intro">Enter a new password for your Voodoo account.</p>
    <form id="form">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
      <button type="submit" id="submit">Update Password</button>
    </form>
    <div id="status"></div>
  </div>

<script>
  const SUPABASE_URL = "https://swyzfsyvmqxabhvvhhtn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uyB6Ssw-KTcOAAB-QJCRDQ_sTNfPuhT";

  // Supabase appends the recovery token as a URL fragment, e.g.
  // #access_token=...&type=recovery&refresh_token=...
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const accessToken = params.get("access_token");
  const statusEl = document.getElementById("status");
  const form = document.getElementById("form");
  const submitBtn = document.getElementById("submit");

  if (!accessToken || params.get("type") !== "recovery") {
    document.getElementById("intro").textContent =
      "This page only works when opened from the password reset link in your email.";
    form.style.display = "none";
  }
</script>
<script>
  if (form && form.style.display !== "none") {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      submitBtn.disabled = true;
      statusEl.textContent = "Updating...";
      statusEl.className = "";

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: "PUT",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          statusEl.textContent = "Password updated! Go back to Voodoo and sign in.";
          statusEl.className = "ok";
          form.style.display = "none";
        } else {
          const data = await res.json().catch(() => ({}));
          statusEl.textContent = data.msg || data.error_description || "Something went wrong. The link may have expired.";
          statusEl.className = "err";
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusEl.textContent = "Network error. Check your connection and try again.";
        statusEl.className = "err";
        submitBtn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
