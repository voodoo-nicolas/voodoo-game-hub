<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your Viral Game Hub password</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0d14; color: #f2f4f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 360px; background: #131826; border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #15ff8c; }
  p { color: #8b93a7; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #8b93a7; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a3142;
    background: #1b2233; color: #f2f4f8; font-size: 15px; margin-bottom: 16px;
  }
  input:focus { outline: 2px solid #15ff8c; }
  .show { display: flex; align-items: center; gap: 8px; margin: -6px 0 16px; color: #8b93a7; font-size: 14px; cursor: pointer; }
  .show input { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: #15ff8c; }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: #15ff8c; color: #0a0d14; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
  .ok { color: #6ee7a0; }
  .err { color: #ff8f7d; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Reset your password</h1>
    <p id="intro">Enter a new password for your Viral Game Hub account.</p>
    <form id="form">
      <label for="password" id="password-label">New password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
      <label class="show"><input type="checkbox" id="show-password"> <span id="show-label">Show password</span></label>
      <button type="submit" id="submit">Update Password</button>
    </form>
    <div id="status"></div>
  </div>

<script>
  const SUPABASE_URL = "https://swyzfsyvmqxabhvvhhtn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uyB6Ssw-KTcOAAB-QJCRDQ_sTNfPuhT";

  // Supabase appends the recovery token as a URL fragment, e.g.
  // #access_token=...&type=recovery&refresh_token=...
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const accessToken = params.get("access_token");
  const statusEl = document.getElementById("status");
  const form = document.getElementById("form");
  const submitBtn = document.getElementById("submit");

  // English, or Spanish when the phone/browser is set to Spanish (?lang=es / ?lang=en overrides).
  const STRINGS = {
    en: {
      page_title: "Reset your Viral Game Hub password",
      title: "Reset your password",
      intro: "Enter a new password for your Viral Game Hub account.",
      password_label: "New password",
      placeholder: "At least 6 characters",
      show: "Show password",
      submit: "Update Password",
      expired: "This reset link has expired or was already used. Go back to the app and tap Forgot password again, then open the newest email.",
      no_link: "This page only works when opened from the password reset link in your email.",
      updating: "Updating...",
      updated: "Password updated! Go back to Viral Game Hub and sign in.",
      failed: "Something went wrong. The link may have expired.",
      same_password: "The new password must be different from your old one.",
      too_short: "The password must be at least 6 characters.",
      network: "Network error. Check your connection and try again.",
    },
    es: {
      page_title: "Restablece tu contraseña de Viral Game Hub",
      title: "Restablece tu contraseña",
      intro: "Escribe una nueva contraseña para tu cuenta de Viral Game Hub.",
      password_label: "Nueva contraseña",
      placeholder: "Al menos 6 caracteres",
      show: "Mostrar contraseña",
      submit: "Cambiar contraseña",
      expired: "Este enlace ha caducado o ya se usó. Vuelve a la app, toca ¿Olvidaste tu contraseña? otra vez y abre el correo más reciente.",
      no_link: "Esta página solo funciona si la abres desde el enlace para restablecer la contraseña de tu correo.",
      updating: "Cambiando...",
      updated: "¡Contraseña cambiada! Vuelve a Viral Game Hub e inicia sesión.",
      failed: "Algo salió mal. Puede que el enlace haya caducado.",
      same_password: "La nueva contraseña debe ser distinta de la anterior.",
      too_short: "La contraseña debe tener al menos 6 caracteres.",
      network: "Error de red. Comprueba tu conexión e inténtalo de nuevo.",
    },
  };
  const langParam = new URLSearchParams(window.location.search).get("lang");
  const lang = (langParam || navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
  const T = STRINGS[lang];
  document.documentElement.lang = lang;
  document.title = T.page_title;
  document.getElementById("title").textContent = T.title;
  document.getElementById("intro").textContent = T.intro;
  document.getElementById("password-label").textContent = T.password_label;
  document.getElementById("password").placeholder = T.placeholder;
  document.getElementById("show-label").textContent = T.show;
  submitBtn.textContent = T.submit;

  document.getElementById("show-password").addEventListener("change", (e) => {
    document.getElementById("password").type = e.target.checked ? "text" : "password";
  });

  if (!accessToken || params.get("type") !== "recovery") {
    // An expired or already-used link comes back as #error_code=otp_expired&error_description=...
    // (email scanners that pre-open the link use it up, so say so).
    const why = params.get("error_code") === "otp_expired" ? T.expired : T.no_link;
    document.getElementById("intro").textContent = why;
    form.style.display = "none";
  }
</script>
<script>
  if (form && form.style.display !== "none") {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      submitBtn.disabled = true;
      statusEl.textContent = T.updating;
      statusEl.className = "";

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: "PUT",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          statusEl.textContent = T.updated;
          statusEl.className = "ok";
          form.style.display = "none";
        } else {
          const data = await res.json().catch(() => ({}));
          // Supabase only answers in English: show its text as-is in English, our own words in Spanish.
          const code = data.error_code || "";
          statusEl.textContent = code === "same_password" ? T.same_password
            : code === "weak_password" ? T.too_short
            : (lang === "en" && (data.msg || data.error_description)) || T.failed;
          statusEl.className = "err";
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusEl.textContent = T.network;
        statusEl.className = "err";
        submitBtn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
